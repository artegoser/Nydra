[workspace]
members = [
    "crates/nydra-core",
    "crates/nydra-chess",
    "crates/nydra-examples",
    "crates/nydra-wasm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/artegoser/nydra"

[workspace.dependencies]
nydra-core = { path = "crates/nydra-core" }
nydra-chess = { path = "crates/nydra-chess" }
nydra-examples = { path = "crates/nydra-examples" }
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
thiserror = "2.0"
wasm-bindgen = "0.2"
